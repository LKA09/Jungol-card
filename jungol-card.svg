<svg xmlns="http://www.w3.org/2000/svg" width="350" height="170" viewBox="0 0 350 170" role="img" aria-label="JUNGOL Lir09 Bronze II">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f939a"/>
      <stop offset="34%" stop-color="#617489"/>
      <stop offset="100%" stop-color="#17304b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="350" height="170" rx="11" fill="url(#card)"/>

  <!-- tier emblem -->
  <text x="38" y="47" fill="#fff" font-family="Segoe Print, Bradley Hand, cursive" font-size="24" font-style="italic">Bronze</text>
  <path d="M34 51 V108 L68 127 L102 108 V51" fill="none" stroke="#fff" stroke-width="2" opacity=".95"/>
  <path d="M34 108 L68 132 L102 108" fill="none" stroke="#fff" stroke-width="2" opacity=".95"/>
  <text x="68" y="101" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">2</text>

  <!-- profile -->
  <text x="136" y="51" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Lir09</text>

  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15">
    <text x="136" y="80" font-weight="700">rate</text>
    <text x="226" y="80">130</text>

    <text x="136" y="101" font-weight="700">solved</text>
    <text x="226" y="101">42</text>

    <text x="136" y="122" font-weight="700">rank</text>
    <text x="226" y="122">#7,367</text>
  </g>

  <!-- progress -->
  <rect x="34" y="141" width="258" height="4" rx="2" fill="#fff" opacity=".38"/>
  <rect x="34" y="141" width="85" height="4" rx="2" fill="#fff"/>
  <text x="299" y="145" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12">33%</text>
  <text x="292" y="158" text-anchor="end" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">130 / 150</text>
</svg>
