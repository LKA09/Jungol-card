name: Update JUNGOL Cards

on:
  push:
    branches: [main]
    paths:
      - generate_card.py
      - generate_tier_previews.py
      - apply_tier_wordmarks.py
      - .github/workflows/update-card.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jungol-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate current cards
        run: python generate_card.py

      - name: Generate tier gallery
        run: python generate_tier_previews.py

      - name: Apply original tier wordmarks
        run: python apply_tier_wordmarks.py

      - name: Commit changed cards
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- jungol-card.svg designs/)" ]; then
            echo "Cards are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- jungol-card.svg designs/
          git commit -m "chore: update JUNGOL cards"
          git push
